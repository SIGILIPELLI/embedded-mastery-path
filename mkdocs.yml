site_name: Embedded Systems Mastery Path
site_description: A structured, module-wise embedded systems training program from entry level to master level, starting with Arduino/ESP32 and C/C++ — every example runnable in the free Wokwi online simulator, no hardware required.
site_url: https://sigilipelli.github.io/embedded-mastery-path/
repo_url: https://github.com/SIGILIPELLI/embedded-mastery-path
repo_name: embedded-mastery-path

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · Setup & Toolchain": level-1/01-setup-toolchain.md
      - "02 · C/C++ for Embedded": level-1/02-c-cpp-for-embedded.md
      - "03 · Digital I/O": level-1/03-digital-io.md
      - "04 · Analog I/O & PWM": level-1/04-analog-io-pwm.md
      - "05 · Serial/UART Communication": level-1/05-serial-uart.md
      - "06 · Sensors, I2C & SPI": level-1/06-sensors-i2c-spi.md
      - "07 · Timers & Interrupts": level-1/07-timers-interrupts.md
      - "08 · Memory & Power Basics": level-1/08-memory-power.md
      - "09 · ESP32 WiFi Intro": level-1/09-esp32-wifi.md
      - "10 · Capstone — Environment Monitor": level-1/10-capstone-project.md
# --- auto-pruned stub levels (see AdSense low-value-content fix) ---
exclude_docs: |
  level-2/*.md
  level-3/*.md
  level-4/*.md
